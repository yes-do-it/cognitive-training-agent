global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: cognitive-training-app
    metrics_path: /api/monitoring/prometheus
    params:
      staleMinutes: ["30"]
      limit: ["50"]
    static_configs:
      - targets: ["cognitive-training-app:8091"]
        labels:
          application: cognitive-training-agent-platform
          environment: cloud
