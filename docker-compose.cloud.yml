services:
  mcp:
    build:
      context: ./cog-train-plat-app
      dockerfile: Dockerfile
    image: cognitive-training-agent-platform:1.0-SNAPSHOT
    container_name: cognitive-training-mcp
    restart: unless-stopped
    expose:
      - "8091"
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      APP_PORT: 8091
      DB_HOST: ${DB_HOST:?DB_HOST must be set}
      DB_PORT: ${DB_PORT:-13306}
      DB_NAME: ${DB_NAME:-cognitive_training}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      COGNITIVE_AGENT_ENABLED: "false"
      COGNITIVE_INDEX_TASK_DISPATCH_ENABLED: "false"
      COGNITIVE_MCP_ENABLED: "true"
      COGNITIVE_MCP_CLIENT_ENABLED: "false"
      COGNITIVE_OPENAI_ENABLED: "false"
      SPRING_AI_OPENAI_API_KEY: disabled
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8091'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  app:
    build:
      context: ./cog-train-plat-app
      dockerfile: Dockerfile
    image: cognitive-training-agent-platform:1.0-SNAPSHOT
    container_name: cognitive-training-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      APP_PORT: ${APP_PORT:-8091}
      DB_HOST: ${DB_HOST:?DB_HOST must be set}
      DB_PORT: ${DB_PORT:-13306}
      DB_NAME: ${DB_NAME:-cognitive_training}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      COGNITIVE_AGENT_ENABLED: ${COGNITIVE_AGENT_ENABLED:-true}
      COGNITIVE_RAG_ENABLED: ${COGNITIVE_RAG_ENABLED:-false}
      COGNITIVE_INDEX_TASK_DISPATCH_ENABLED: ${COGNITIVE_INDEX_TASK_DISPATCH_ENABLED:-true}
      PGVECTOR_URL: ${PGVECTOR_URL:-jdbc:postgresql://vector_db:5432/ai-rag-knowledge}
      PGVECTOR_USERNAME: ${PGVECTOR_USERNAME:-cogtrain_app}
      PGVECTOR_PASSWORD: ${PGVECTOR_PASSWORD:?PGVECTOR_PASSWORD must be set}
      COGNITIVE_MCP_ENABLED: ${COGNITIVE_MCP_ENABLED:-false}
      COGNITIVE_MCP_CLIENT_ENABLED: ${COGNITIVE_MCP_CLIENT_ENABLED:-true}
      COGNITIVE_MCP_SERVER_URL: ${COGNITIVE_MCP_SERVER_URL:-http://mcp:8091/mcp}
      COGNITIVE_OPENAI_ENABLED: ${COGNITIVE_OPENAI_ENABLED:-true}
      SPRING_AI_OPENAI_MODEL: ${SPRING_AI_OPENAI_MODEL:-gpt-4.1-mini}
      SPRING_AI_OPENAI_BASE_URL: ${SPRING_AI_OPENAI_BASE_URL:-https://api.openai.com}
      # Replace the placeholder with a real provider key before using Agent.
      SPRING_AI_OPENAI_API_KEY: ${SPRING_AI_OPENAI_API_KEY:-disabled}
    ports:
      - "${APP_PORT:-8091}:${APP_PORT:-8091}"
    depends_on:
      mcp:
        condition: service_healthy


    networks:
      - default
      - pgvector-network

networks:
  pgvector-network:
    external: true
    name: dev-ops_my-network


